line-length = 100
target-version = "py312"

[lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PL", "PT", "DTZ", "PIE", "PERF", "FLY", "ISC", "RET", "FURB", "EXE"]
ignore = ["E501", "BLE001", "S110",
    # This repo's ratchet: each rule the family config still finds here, and its places today.
    "PLR2004",  # 21
    "RUF046",  # 18
    "PT006",  # 12
    "PLR0913",  # 11
    "SIM117",  # 5
    "PLR0917",  # 4
    "RET504",  # 2
    "PERF401",  # 2
    "PLR0915",  # 2
    "C408",  # 2
    "UP022",  # 1
    "PLR0911",  # 1
    "SIM105",  # 1
    "PLR0912",  # 1
    "E402",  # 1
]
external = ["ARG", "N", "S", "E501", "BLE001", "S110", "PLR2004", "RUF046", "PT006", "PLR0913", "SIM117", "PLR0917", "RET504", "PERF401", "PLR0915", "C408", "UP022", "PLR0911", "SIM105", "PLR0912", "E402"]

[lint.per-file-ignores]
"**/vulture_whitelist.py" = ["B018", "F821"]
"**/tests/**" = ["PLR2004"]
"**/test_*.py" = ["PLR2004"]

[format]
quote-style = "double"
